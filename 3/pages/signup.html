<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#661f3f"><meta name="description" content="Create a Rosewood Florals account for quicker gifting and order history."><title>Sign Up — Rosewood Florals</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><link rel="stylesheet" href="../assets/css/floral.css?v=layout-20260911-2"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js?v=layout-20260911-2" defer></script>
</head>
<body data-root=".." data-page="signup">
  <header class="standalone-nav" aria-label="Site preferences">
    <div class="container standalone-nav-shell">
      <a class="brand" href="../index.html" aria-label="Rosewood Florals home"><strong>Rosewood</strong><small>Florals</small></a>
      <div class="standalone-nav-actions">
        <button class="dir-toggle" type="button" data-rtl-toggle aria-label="Switch text direction">
          <span class="dir-opt" data-dir="ltr">LTR</span>
          <span class="dir-opt" data-dir="rtl">RTL</span>
        </button>
        <button class="icon-btn theme-btn" type="button" data-theme-toggle aria-label="Switch theme">
          <i data-lucide="moon" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="auth-page floral-auth">
    <div class="container auth-layout">
      <figure class="auth-photo"><img src="../assets/images/signup-hero.webp" alt="Cheerful pastel pink tulips arranged in soft natural studio light" width="1536" height="1024" fetchpriority="high"><figcaption>More reasons to send flowers.</figcaption></figure>
      <section class="auth-card" data-reveal>
        <p class="eyebrow">Sign Up</p>
        <h1>Make thoughtful<br><span class="display-italic">gifting easier.</span></h1>
        <form data-validate data-success="Your demo account is ready.">
          <div class="form-grid">
            <div class="field"><label for="signup-name">Full name</label><input id="signup-name" name="name" autocomplete="name" required><p class="error-message" aria-live="polite"></p></div>
            <div class="field"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required><p class="error-message" aria-live="polite"></p></div>
            <div class="field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="error-message" aria-live="polite"></p></div>
            <button class="btn btn-primary" type="submit">Sign Up</button>
            <p class="form-success" role="status">Your account is ready in this front-end demo.</p>
          </div>
        </form>
        <p class="auth-links">Already have an account? <a href="signin.html">Sign in</a></p>
      </section>
    </div>
  </main>
</body>
</html>
