<!doctype html>
<html lang="en" dir="ltr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to the Ironlane Moto Works demonstration rider account."><meta name="theme-color" content="#111211"><title>Sign In | Ironlane Moto Works</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../assets/images/favicon.svg">
  <script>document.documentElement.dataset.theme=localStorage.getItem('ironlane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dir=localStorage.getItem('ironlane-direction')||'ltr';</script><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/visual-updates.css?v=1.2.1">
</head><body data-root="../" data-page="signin">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="standalone-header">
    <a class="brand" href="../index.html" aria-label="Ironlane Moto Works home">
      <span class="brand-mark" aria-hidden="true">I</span>
      <span class="brand-copy"><strong>Ironlane</strong><small>Moto Works</small></span>
    </a>
    <div class="header-actions">
      <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" aria-pressed="false">
        <i class="theme-icon-moon" data-lucide="moon" aria-hidden="true"></i>
        <i class="theme-icon-sun" data-lucide="sun" aria-hidden="true"></i>
      </button>
      <button class="icon-button dir-toggle" type="button" data-rtl-toggle aria-label="Switch to RTL layout" title="Switch text direction">
        <span class="dir-toggle-text">RTL</span>
      </button>
    </div>
  </header>
  <main id="main-content" class="auth-shell"><section class="auth-card"><img class="auth-photo" src="../assets/images/unique/hero-signin.webp" width="1600" height="800" alt="Motorcycle key, riding gloves and a service-history booklet at reception" fetchpriority="high" data-image="hero-signin" srcset="../assets/images/unique/hero-signin-640.webp 640w, ../assets/images/unique/hero-signin.webp 1600w" sizes="(max-width: 639px) calc(100vw - 32px), 480px"><div class="form-shell reveal"><span class="section-kicker">Rider account demo</span><h1 style="font-size:clamp(2.8rem,10vw,4.5rem)">Welcome <span class="accent">back.</span></h1><p class="section-intro">Front-end demonstration only. No account data is transmitted or stored.</p>
  <form data-validate data-success="Demo sign-in validated. Connect this form to a secure authentication service before production." novalidate><div class="field"><label for="signin-email">Email <span aria-hidden="true">*</span></label><input id="signin-email" name="email" type="email" autocomplete="email" required aria-describedby="signin-email-error"><p class="field-error" id="signin-email-error" aria-live="polite"></p></div><div class="field"><div class="field-label-row"><label for="signin-password">Password <span aria-hidden="true">*</span></label><button type="button" class="forgot-password-link" id="forgot-password-trigger" aria-haspopup="dialog">Forgot password?</button></div><input id="signin-password" name="password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="signin-password-error"><p class="field-error" id="signin-password-error" aria-live="polite"></p></div><button class="btn" style="width:100%" type="submit">Sign in</button><p class="form-status" data-form-status tabindex="-1" role="status"></p></form><p class="form-note">No account? <a href="signup.html">Create a demo profile</a>. <a href="../index.html">Return home</a>.</p>
  </div></section>
  <dialog id="forgot-password-modal" class="auth-modal" aria-labelledby="forgot-modal-title">
    <div class="auth-modal-inner">
      <button type="button" class="modal-close-btn" id="forgot-modal-close" aria-label="Close dialog">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
      <div class="auth-modal-header">
        <div class="auth-modal-icon">
          <i data-lucide="key-round" aria-hidden="true"></i>
        </div>
        <h2 id="forgot-modal-title">Reset password</h2>
        <p>Enter your account email and we will send you instructions to reset your password.</p>
      </div>
      <form data-validate data-success="Password reset instructions sent! Please check your inbox." novalidate class="forgot-form">
        <div class="field">
          <label for="reset-email">Email <span aria-hidden="true">*</span></label>
          <input id="reset-email" name="email" type="email" autocomplete="email" required aria-describedby="reset-email-error" placeholder="name@example.com">
          <p class="field-error" id="reset-email-error" aria-live="polite"></p>
        </div>
        <button class="btn" style="width:100%" type="submit">Send reset instructions</button>
        <p class="form-status" data-form-status tabindex="-1" role="status"></p>
      </form>
      <div class="auth-modal-footer">
        <button type="button" class="text-link" id="forgot-modal-back">
          <i data-lucide="arrow-left" aria-hidden="true"></i> Return to sign in
        </button>
      </div>
    </div>
  </dialog>
  </main><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js?v=1.1.1" defer></script></body></html>
