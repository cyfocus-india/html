<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coming Soon | Oven &amp; Bloom</title>
    <meta
      name="description"
      content="Coming Soon. Sign up for updates and announcements from Oven &amp; Bloom."
    />
    <meta name="robots" content="noindex" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Geist:wght@400;500;600;700&display=swap"
    />
<link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="utility-page">
      <div class="page-actions">
        <button
          class="icon-btn"
          type="button"
          data-direction-toggle
          aria-label="Switch to Right-to-Left layout (RTL)"
          aria-pressed="false"
        >
          <span class="dir-badge" aria-hidden="true">RTL</span>
        </button>
        <button
          class="icon-btn"
          type="button"
          data-theme-toggle
          aria-label="Use dark theme"
          aria-pressed="false"
        >
          <i class="ph ph-moon" aria-hidden="true"></i>
        </button>
      </div>
      <div class="utility-page__content">
        <a class="brand" href="../index.html"
          ><span class="brand-mark"><i class="ph ph-cake"></i></span
          ><span>Oven &amp; Bloom</span></a
        >
        <span class="eyebrow">Coming Soon</span>
        <h1>
          Coming Soon
        </h1>
        <p class="lead">
          This page is currently under preparation. Leave your email address below to receive updates and announcements.
        </p>
        <!-- TODO: Connect to your verified newsletter provider. -->
        <form
          class="newsletter-form"
          action="#"
          data-validate
          novalidate
        >
          <div class="newsletter-form__bar">
            <label class="visually-hidden" for="soon-email">Email</label>
            <input
              id="soon-email"
              type="email"
              placeholder="Your email address"
              required
            />
            <button class="btn btn--primary" type="submit">Subscribe</button>
          </div>
          <span class="form-status" role="alert" aria-live="polite"
            >Demo signup validated. Connect your newsletter endpoint.</span
          >
        </form>
        <a class="text-link" href="../index.html"
          >Back to Home 1 <i class="ph ph-arrow-right"></i
        ></a>
      </div>
    </main>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
