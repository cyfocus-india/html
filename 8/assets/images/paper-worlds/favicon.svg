    <rect x="-12" y="-11" width="24" height="24" rx="5" fill="#d7cbba"/>
    <rect x="-12" y="-12" width="24" height="24" rx="5" fill="url(#favDie)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- 5 Big High-Contrast Red Pips -->
    <circle cx="-6" cy="-6" r="2.2" fill="#bf3e26"/>
    <circle cx="6" cy="-6" r="2.2" fill="#bf3e26"/>
    <circle cx="0" cy="0" r="2.2" fill="#bf3e26"/>
    <circle cx="-6" cy="6" r="2.2" fill="#bf3e26"/>
    <circle cx="6" cy="6" r="2.2" fill="#bf3e26"/>
