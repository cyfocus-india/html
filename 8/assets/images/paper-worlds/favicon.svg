      <stop offset="0%" stop-color="#1a5963"/>
      <stop offset="100%" stop-color="#0a2e34"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea9e"/>
      <stop offset="50%" stop-color="#f5c364"/>
      <stop offset="100%" stop-color="#cb811b"/>
