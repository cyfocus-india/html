<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AuraWash Laundry &amp; Dry Cleaning</title>
  <meta name="description" content="Register for AuraWash to unlock doorstep pickup schedules, free customized laundry hampers, and garment care tracking.">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="auth-page-body">

  <!-- Auth Topbar with Logo and Toggles (No standard header/footer) -->
  <header class="auth-header-bar">
    <a href="../index.html" class="site-logo" aria-label="AuraWash Home 1">
      <img src="../assets/images/logo.png" alt="AuraWash Logo" class="site-logo-img">
    </a>

    <div class="auth-controls">
      <button type="button" class="toggle-btn theme-toggle-btn" aria-label="Toggle light and dark theme"><span class="toggle-icon">☾</span><span class="toggle-text">Dark</span></button>
      <button type="button" class="toggle-btn dir-toggle-btn" aria-label="Toggle text direction"><span class="toggle-icon">⇄</span><span class="toggle-text">RTL</span></button>
    </div>
  </header>

  <!-- Auth Content Container -->
  <main class="auth-main-wrap">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="badge" style="margin-bottom: 0.5rem;">New Customer</div>
        <h1>Create Account</h1>
        <p>Start scheduling doorstep laundry &amp; dry cleaning in minutes</p>
      </div>

      <div id="signupError" class="alert-box" style="background-color:#fee2e2; color:#b91c1c; border:1px solid #ef4444; margin-bottom:1.25rem;"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="signupName" class="form-label">Full Name *</label>
          <input type="text" id="signupName" class="form-input" placeholder="e.g. Eleanor Vance" required>
        </div>

        <div class="form-group">
          <label for="signupEmail" class="form-label">Email Address *</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="e.g. eleanor@example.com" required>
        </div>

        <div class="form-group">
          <label for="signupPhone" class="form-label">Phone Number (For SMS arrival alerts) *</label>
          <input type="tel" id="signupPhone" class="form-input" placeholder="e.g. (555) 438-2910" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupPassword" class="form-label">Password *</label>
            <div class="password-input-wrap">
              <input type="password" id="signupPassword" class="form-input" placeholder="Min. 6 chars" required>
              <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword" class="form-label">Confirm Password *</label>
            <div class="password-input-wrap">
              <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Re-type password" required>
              <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>
        </div>

        <div class="form-group" style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
          <label class="auth-checkbox-label" style="font-size: 0.85rem;">
            <input type="checkbox" id="signupTerms" required checked style="accent-color: var(--brand-primary);">
            <span>I agree to the Terms of Service &amp; Garment Care Guarantee</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Account</button>
      </form>

      <div class="auth-footer-prompt">
        Already have an AuraWash account? <a href="signin.html" style="font-weight: 700;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
