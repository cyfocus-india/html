<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AuraWash Laundry &amp; Dry Cleaning</title>
  <meta name="description" content="Sign in to your AuraWash customer portal to manage pickup schedules, track live garment cleaning, and view invoices.">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="auth-page-body">

  <!-- Auth Topbar with Logo and Toggles (No standard header/footer) -->
  <header class="auth-header-bar">
    <a href="../index.html" class="site-logo" aria-label="AuraWash Home 1">
      <img src="../assets/images/logo.png" alt="AuraWash Logo" class="site-logo-img">
    </a>

    <div class="auth-controls">
      <button type="button" class="toggle-btn theme-toggle-btn" aria-label="Toggle light and dark theme"><span class="toggle-icon">☾</span><span class="toggle-text">Dark</span></button>
      <button type="button" class="toggle-btn dir-toggle-btn" aria-label="Toggle text direction"><span class="toggle-icon">⇄</span><span class="toggle-text">RTL</span></button>
    </div>
  </header>

  <!-- Auth Content Container -->
  <main class="auth-main-wrap">
    <div class="auth-card">
      <!-- 1. Sign In Form View -->
      <div id="loginFormCard">
        <div class="auth-card-header">
          <div class="badge" style="margin-bottom: 0.5rem;">Customer Portal</div>
          <h1>Sign In</h1>
          <p>Access your pickup schedules and garment tracking</p>
        </div>

        <div id="signinError" class="alert-box" style="background-color:#fee2e2; color:#b91c1c; border:1px solid #ef4444; margin-bottom:1.25rem;"></div>

        <form id="signinForm" novalidate>
          <div class="form-group">
            <label for="signinEmail" class="form-label">Email Address</label>
            <input type="email" id="signinEmail" class="form-input" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="signinPassword" class="form-label">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="signinPassword" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>

          <div class="auth-sub-links">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="rememberMe" checked style="accent-color: var(--brand-primary);">
              <span>Remember me</span>
            </label>
            <a href="#" id="forgotPasswordLink" style="font-weight: 600;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Sign In</button>
        </form>

        <div class="auth-footer-prompt">
          Don't have an AuraWash account? <a href="signup.html" style="font-weight: 700;">Sign Up</a>
        </div>
      </div>

      <!-- 2. Password Reset View (Toggled on Same Page) -->
      <div id="resetPasswordCard" style="display: none;">
        <div class="auth-card-header">
          <div class="badge" style="margin-bottom: 0.5rem;">Account Recovery</div>
          <h2>Reset Password</h2>
          <p>Enter your account email to receive a password reset link.</p>
        </div>

        <div id="resetSuccessAlert" class="alert-box alert-success"></div>

        <form id="resetPasswordForm" novalidate>
          <div class="form-group">
            <label for="resetEmail" class="form-label">Registered Email Address</label>
            <input type="email" id="resetEmail" class="form-input" placeholder="e.g. name@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1rem;">Send Reset Link</button>
          
          <button type="button" id="backToLoginLink" class="btn btn-secondary" style="width: 100%;">Back to Sign In</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
