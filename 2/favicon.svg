<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="driveway-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3860"/>
      <stop offset="50%" stop-color="#08263f"/>
      <stop offset="100%" stop-color="#051c2f"/>
    </linearGradient>
    <linearGradient id="needle-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4512a"/>
      <stop offset="100%" stop-color="#ff6b42"/>
    </linearGradient>
  </defs>

  <!-- App icon squircle badge -->
  <rect width="512" height="512" rx="115" fill="url(#driveway-bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="109" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Speedometer Arc -->
  <path d="M 133.9 375.4 A 155 155 0 1 1 378.1 375.4"
        fill="none"
        stroke="#ffffff"
        stroke-width="44"
        stroke-linecap="round"/>

  <!-- Speedometer Needle -->
  <line x1="256" y1="280" x2="348" y2="188"
        stroke="url(#needle-gradient)"
        stroke-width="30"
        stroke-linecap="round"/>

  <!-- Center Hub -->
  <circle cx="256" cy="280" r="36" fill="#ffffff"/>
  <circle cx="256" cy="280" r="22" fill="#08263f"/>
  <circle cx="256" cy="280" r="12" fill="#f4512a"/>
</svg>