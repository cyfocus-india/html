<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075bea" />
      <stop offset="100%" stop-color="#14a3ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a3d" />
      <stop offset="100%" stop-color="#0b2c63" />
    </linearGradient>
  </defs>
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Graduation Cap & Knowledge Check Icon -->
  <g transform="translate(12, 12)" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Graduation Cap Top -->
    <path d="M20 5 L36 13 L20 21 L4 13 Z" fill="url(#brandGrad)" stroke="#ffffff" stroke-width="2" />
    <!-- Tassel -->
    <path d="M33 14.5 V24 C33 25.5 35 25.5 35 24 V15.5" stroke="#4fe0fc" stroke-width="2" />
    <!-- Open Book Pages beneath -->
    <path d="M8 22 V31 C14 27 20 31 20 31 C20 31 26 27 32 31 V22" stroke="url(#brandGrad)" stroke-width="2.5" />
    <!-- Center spine -->
    <line x1="20" y1="21" x2="20" y2="31" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
