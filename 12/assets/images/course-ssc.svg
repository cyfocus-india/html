  </g>
  <circle cx="480" cy="120" r="90" fill="#34d399" opacity="0.25" filter="url(#softGlowSsc)"/>
  <rect x="44" y="32" width="110" height="26" rx="13" fill="rgba(255,255,255,0.16)"/>
  <text x="58" y="49" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">STAFF SELECTION</text>
  <text x="44" y="98" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">SSC CGL, CHSL, MTS &amp; CPO</text>
