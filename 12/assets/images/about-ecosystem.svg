<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081d4a"/>
      <stop offset="50%" stop-color="#0d3278"/>
      <stop offset="100%" stop-color="#144bb8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="20" fill="url(#ecoBg)"/>
  
  <!-- Subtle Grid background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="720" y2="80"/>
    <line x1="0" y1="160" x2="720" y2="160"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="320" x2="720" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Central Hub Orbit Halo -->
  <circle cx="360" cy="200" r="78" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Symmetrical Radial Connector Rays (Flush from card corner to hub) -->
  <line x1="260.5" y1="110.5" x2="310.9" y2="155.9" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="459.5" y1="110.5" x2="409.1" y2="155.9" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="260.5" y1="289.5" x2="310.9" y2="244.1" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="459.5" y1="289.5" x2="409.1" y2="244.1" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Terminal Connection Nodes at card corners -->
  <circle cx="260.5" cy="110.5" r="2.5" fill="#38bdf8"/>
  <circle cx="459.5" cy="110.5" r="2.5" fill="#38bdf8"/>
  <circle cx="260.5" cy="289.5" r="2.5" fill="#38bdf8"/>
  <circle cx="459.5" cy="289.5" r="2.5" fill="#38bdf8"/>

  <!-- Central Hub Circular Emblem -->
  <circle cx="360" cy="200" r="66" fill="url(#glowCircle)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="drop-shadow(0 10px 30px rgba(14,165,233,0.4))"/>
  
  <!-- Brand Center Icon -->
  <g transform="translate(346, 167)">
    <polygon points="14,4 26,10 14,16 2,10" fill="#ffffff"/>
    <path d="M6 13 L6 19 Q14 23 22 19 L22 13" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="24" cy="19" r="2" fill="#fde047"/>
    <path d="M14 17 L14 24" stroke="#ffffff" stroke-width="1.6"/>
  </g>

  <!-- Central Hub Typography -->
  <text x="360" y="214" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.02em">ExamSuccess</text>
  <text x="360" y="229" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.12em">ECOSYSTEM</text>

  <!-- Node 1: Top Left - 500+ Faculty -->
  <g transform="translate(32, 38)">
    <rect width="232" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="28" cy="38" r="16" fill="#2563eb"/>
    <circle cx="28" cy="34" r="5" fill="#ffffff"/>
    <path d="M18 45 A10 5 0 0 1 38 45" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="54" y="33" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="750">500+ Top Faculty</text>
    <text x="54" y="51" fill="#bfdbfe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Ex-examiners &amp; specialists</text>
  </g>

  <!-- Node 2: Top Right - CBT Mock Simulations -->
  <g transform="translate(456, 38)">
    <rect width="232" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="28" cy="38" r="16" fill="#059669"/>
    <rect x="21" y="29" width="14" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <path d="M25 38 L27 40 L31 35" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="54" y="33" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="750">Real CBT Simulator</text>
    <text x="54" y="51" fill="#a7f3d0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">10,000+ authentic tests</text>
  </g>

  <!-- Node 3: Bottom Left - Score Diagnostics -->
  <g transform="translate(32, 286)">
    <rect width="232" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="28" cy="38" r="16" fill="#d97706"/>
    <path d="M20 44 L25 37 L30 40 L36 29" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="54" y="33" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="750">Score Diagnostics</text>
    <text x="54" y="51" fill="#fde68a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Sub-topic accuracy tracking</text>
  </g>

  <!-- Node 4: Bottom Right - 2.5 Lakh+ Aspirants Community -->
  <g transform="translate(456, 286)">
    <rect width="232" height="76" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="28" cy="38" r="16" fill="#7c3aed"/>
    <circle cx="25" cy="34" r="4" fill="#ffffff"/>
    <path d="M18 45 A7 4 0 0 1 32 45" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="33" cy="35" r="3.5" fill="#ffffff" opacity="0.9"/>
    <path d="M28 45 A5 3 0 0 1 38 45" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.9"/>
    <text x="54" y="33" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="750">2.5 Lakh+ Aspirants</text>
    <text x="54" y="51" fill="#ddd6fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">15,000+ selections to date</text>
  </g>
</svg>
