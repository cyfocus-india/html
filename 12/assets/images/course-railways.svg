<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="55%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softGlowRail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="260" rx="14" fill="url(#railGrad)"/>
  <!-- Track Perspective Lines in Background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="380" y1="260" x2="470" y2="40"/>
    <line x1="580" y1="260" x2="490" y2="40"/>
    <line x1="400" y1="230" x2="560" y2="230"/>
    <line x1="415" y1="200" x2="545" y2="200"/>
    <line x1="430" y1="170" x2="530" y2="170"/>
    <line x1="445" y1="140" x2="515" y2="140"/>
  </g>
  <circle cx="480" cy="110" r="85" fill="#f97316" opacity="0.25" filter="url(#softGlowRail)"/>
  <rect x="44" y="32" width="138" height="26" rx="13" fill="rgba(255,255,255,0.16)"/>
  <text x="58" y="49" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">RAILWAYS RRB TRACK</text>
  <text x="44" y="98" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">RRB NTPC, Group D &amp; ALP</text>
  <text x="44" y="124" fill="#ffedd5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">CBT-1 &amp; CBT-2 Bilingual Prep, General Science &amp; Tech Drills</text>
  <g transform="translate(44, 160)">
    <rect width="112" height="32" rx="8" fill="rgba(255,255,255,0.12)"/>
    <text x="14" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">CBT-1 &amp; 2</text>
    <rect x="124" width="138" height="32" rx="8" fill="rgba(255,255,255,0.12)"/>
    <text x="138" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">25,000+ Enrolled</text>
  </g>
  <!-- Right Side Graphic: Sleek Modern Bullet Train Front -->
  <g transform="translate(420, 50)">
    <circle cx="65" cy="70" r="62" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- Locomotive Cab -->
    <path d="M40 120 L40 65 Q40 30 65 30 Q90 30 90 65 L90 120 Z" fill="#ffffff"/>
    <path d="M48 60 L82 60 L78 80 L52 80 Z" fill="#1e293b"/>
    <!-- Headlights -->
    <circle cx="48" cy="100" r="5" fill="#fde047"/>
    <circle cx="82" cy="100" r="5" fill="#fde047"/>
    <rect x="58" y="98" width="14" height="4" rx="2" fill="#ef4444"/>
    <line x1="28" y1="126" x2="102" y2="126" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
