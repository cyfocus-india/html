<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="feesBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062254"/>
      <stop offset="60%" stop-color="#0c3d96"/>
      <stop offset="100%" stop-color="#165dc9"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(245,158,11,0.35)"/>
    </filter>
  </defs>
  
  <!-- Banner Background -->
  <rect width="860" height="300" rx="18" fill="url(#feesBannerGrad)"/>
  
  <!-- Right Side Background Glow Circles -->
  <circle cx="720" cy="150" r="116" fill="rgba(255,255,255,0.05)"/>
  <circle cx="720" cy="150" r="92" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Left Side: Guarantee & Value Proposition -->
  <g transform="translate(44, 42)">
    <!-- Eyebrow Pill -->
    <rect width="186" height="26" rx="13" fill="rgba(255,255,255,0.16)"/>
    <text x="14" y="18" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="750" letter-spacing="0.06em">100% RISK-FREE ENROLMENT</text>
    
    <!-- Main Headline -->
    <text x="0" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">7-Day Full Money-Back Guarantee</text>
    
    <!-- Subtitle Lines -->
    <text x="0" y="96" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Attend live classes, attempt full-length CBT tests, and explore study notes.</text>
    <text x="0" y="118" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">If you are not completely satisfied, receive a 100% refund — no questions asked.</text>
    
    <!-- 3 Mini Trust Badges -->
    <g transform="translate(0, 152)">
      <!-- Badge 1: Zero Hidden Fees -->
      <g>
        <rect width="145" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#10b981"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Zero Hidden Fees</text>
      </g>

      <!-- Badge 2: Free Batch Switching -->
      <g transform="translate(155, 0)">
        <rect width="165" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#f59e0b"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Free Batch Switching</text>
      </g>

      <!-- Badge 3: Instant Course Access -->
      <g transform="translate(330, 0)">
        <rect width="168" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#38bdf8"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Instant Course Access</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Big Official Trust Seal Graphic -->
  <g transform="translate(720, 150)" filter="url(#sealShadow)">
    <circle r="74" fill="url(#goldSeal)"/>
    <circle r="64" fill="#09255e"/>
    <circle r="58" fill="none" stroke="url(#goldSeal)" stroke-width="2" stroke-dasharray="5 3.5"/>
    <text y="-21" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.1em">EXAMSUCCESS</text>
    <text y="10" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="900">100%</text>
    <text y="27" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="750" letter-spacing="0.08em">REFUND GUARANTEE</text>
    <text y="43" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.04em">7 DAYS VALIDITY</text>
  </g>
</svg>
