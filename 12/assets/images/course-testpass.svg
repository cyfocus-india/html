<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softGlowTest" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="260" rx="14" fill="url(#testGrad)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="380" y1="0" x2="380" y2="260"/>
    <line x1="480" y1="0" x2="480" y2="260"/>
  </g>
  <circle cx="480" cy="125" r="90" fill="#60a5fa" opacity="0.3" filter="url(#softGlowTest)"/>
  <!-- Left Side Badges & Text -->
  <rect x="44" y="32" width="168" height="26" rx="13" fill="rgba(255,255,255,0.16)"/>
  <text x="58" y="49" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">TEST SERIES &amp; MOCKS</text>
  <text x="44" y="98" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">All-India Test Pass (500+ Mocks)</text>
  <text x="44" y="124" fill="#dbeafe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Sectional, Chapter &amp; Full Length Mocks with AIR Ranking</text>
  <g transform="translate(44, 160)">
    <rect width="112" height="32" rx="8" fill="rgba(255,255,255,0.12)"/>
    <text x="14" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">500+ Mocks</text>
    <rect x="124" width="138" height="32" rx="8" fill="rgba(255,255,255,0.12)"/>
    <text x="138" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">40,000+ Enrolled</text>
  </g>
  <!-- Right Side Graphic: Clipboard, Stopwatch & Analytics Graph Motif -->
  <g transform="translate(425, 48)">
    <circle cx="65" cy="72" r="62" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- Clipboard Outline -->
    <rect x="36" y="32" width="58" height="82" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="52" y="24" width="26" height="14" rx="4" fill="#3b82f6"/>
    <!-- Checklist items inside clipboard -->
    <circle cx="48" cy="50" r="4" fill="#10b981"/>
    <line x1="58" y1="50" x2="80" y2="50" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="66" r="4" fill="#10b981"/>
    <line x1="58" y1="66" x2="84" y2="66" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="82" r="4" fill="#3b82f6"/>
    <line x1="58" y1="82" x2="76" y2="82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="98" r="4" fill="#f59e0b"/>
    <line x1="58" y1="98" x2="82" y2="98" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Small Target / Star badge -->
    <circle cx="85" cy="100" r="14" fill="#f59e0b"/>
    <path d="M85 92 L87 97 L92 98 L88 102 L89 107 L85 104 L81 107 L82 102 L78 98 L83 97 Z" fill="#ffffff"/>
  </g>
</svg>
