<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mentorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09214e"/>
      <stop offset="60%" stop-color="#113e8b"/>
      <stop offset="100%" stop-color="#1e5dc4"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(245,158,11,0.4)"/>
    </filter>
  </defs>
  
  <!-- Banner Background -->
  <rect width="860" height="300" rx="18" fill="url(#mentorBg)"/>
  
  <!-- Right Side Background Glow Circles -->
  <circle cx="730" cy="150" r="116" fill="rgba(255,255,255,0.05)"/>
  <circle cx="730" cy="150" r="92" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Left Side: Mentorship Value Proposition -->
  <g transform="translate(44, 42)">
    <!-- Eyebrow Pill -->
    <rect width="186" height="26" rx="13" fill="rgba(255,255,255,0.16)"/>
    <text x="14" y="18" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="750" letter-spacing="0.06em">1-ON-1 MENTORSHIP</text>
    
    <!-- Main Headline -->
    <text x="0" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800">Direct Guidance from Subject Specialists</text>
    
    <!-- Subtitle Lines -->
    <text x="0" y="96" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Beyond classroom lectures, get weekly strategy calls, personal doubt clearing,</text>
    <text x="0" y="118" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">and diagnostic review of your mock test attempts with ex-examiners.</text>
    
    <!-- 3 Mini Trust Badges -->
    <g transform="translate(0, 152)">
      <!-- Badge 1: Daily Doubt Hours -->
      <g>
        <rect width="155" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#38bdf8"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Daily Doubt Hours</text>
      </g>

      <!-- Badge 2: 1:1 Strategy Calls -->
      <g transform="translate(165, 0)">
        <rect width="160" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#a855f7"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1:1 Strategy Calls</text>
      </g>

      <!-- Badge 3: Interview Panels -->
      <g transform="translate(335, 0)">
        <rect width="155" height="40" rx="8" fill="rgba(255,255,255,0.12)"/>
        <circle cx="22" cy="20" r="9" fill="#10b981"/>
        <path d="M18 20 L21 23 L27 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="25" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Interview Panels</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Mentor interaction graphic -->
  <g transform="translate(730, 150)">
    <circle r="72" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="-18" cy="-8" r="28" fill="url(#avatarGlow)"/>
    <circle cx="-18" cy="-14" r="11" fill="#ffffff"/>
    <path d="M-34 10 A16 10 0 0 1 -2 10" fill="#ffffff"/>
    
    <circle cx="26" cy="18" r="22" fill="#059669"/>
    <circle cx="26" cy="13" r="8" fill="#ffffff"/>
    <path d="M13 32 A13 8 0 0 1 39 32" fill="#ffffff"/>
    
    <!-- Chat bubble badge -->
    <rect x="-14" y="-55" width="68" height="26" rx="6" fill="#f59e0b" filter="url(#badgeShadow)"/>
    <text x="20" y="-38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">AIR 142</text>
  </g>
</svg>
