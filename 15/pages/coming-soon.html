<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A brighter update is on the way. Sign up to get notified when SolarNest launches new features.">
  <title>Coming Soon — SolarNest</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</head>
<body data-page="coming-soon">
  <div class="standalone-layout">
    <div class="standalone-nav">
      <a class="btn btn-sm btn-outline" href="../index.html"><i data-lucide="arrow-left"></i> Back to Home</a>
      <div class="standalone-actions">
        <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme"><i data-lucide="moon"></i></button>
        <button class="icon-button rtl-toggle" type="button" data-rtl-toggle aria-label="Toggle right-to-left layout" title="Toggle RTL layout"><span class="rtl-label">RTL</span></button>
      </div>
    </div>
    <main id="main-content" class="standalone-body">
      <div class="coming-soon-card card reveal" style="max-width: 540px; margin: 0 auto; text-align: center; padding: 44px 34px;">
        <div class="coming-soon-icon" style="margin-bottom: 16px;">
          <i data-lucide="sun" style="width: 48px; height: 48px; color: var(--sun);"></i>
        </div>
        <span class="eyebrow">A brighter update is on the way</span>
        <h1 style="font-size: clamp(2.2rem, 5vw, 3.2rem); margin: 6px 0 12px; letter-spacing: -0.04em;">Coming Soon.</h1>
        <p class="muted" style="max-width: 460px; margin: 0 auto 24px; font-size: 0.96rem;">We’re preparing an all-new SolarNest platform with live rooftop telemetry, smart energy sizing, and one-click PM Surya Ghar subsidy tracking.</p>
        
        <div class="coming-soon-features" style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;">
          <span class="trust-pill" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.82rem; font-weight: 600;"><i data-lucide="zap" style="color:var(--green)"></i> Live Telemetry</span>
          <span class="trust-pill" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.82rem; font-weight: 600;"><i data-lucide="cpu" style="color:var(--green)"></i> Smart Sizing</span>
          <span class="trust-pill" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 0.82rem; font-weight: 600;"><i data-lucide="shield-check" style="color:var(--green)"></i> DISCOM Sync</span>
        </div>

        <form class="notify-form validated-form" novalidate>
          <div class="notify-input-group" style="display: flex; gap: 8px; max-width: 440px; margin: 0 auto;">
            <input type="email" name="email" required aria-label="Email address" placeholder="Enter your email for early access" style="flex:1">
            <button class="btn" type="submit"><i data-lucide="bell"></i> Notify Me</button>
          </div>
          <div class="field-error" aria-live="polite" style="margin-top: 8px; font-size: 0.76rem;"></div>
        </form>

        <div style="margin-top: 24px;">
          <a class="btn btn-outline btn-sm" href="../index.html"><i data-lucide="home"></i> Return to Homepage</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
