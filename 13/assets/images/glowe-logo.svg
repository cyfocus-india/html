<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none" role="img" aria-label="Glowé Botanical Skincare">
  <defs>
    <linearGradient id="gloweLeafGrad" x1="16" y1="12" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7a9155"/>
      <stop offset="100%" stop-color="#556c34"/>
    </linearGradient>
    <linearGradient id="gloweSunGrad" x1="20" y1="10" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eb7378"/>
      <stop offset="100%" stop-color="#d99a34"/>
    </linearGradient>
  </defs>

  <!-- Emblem Mark Container -->
  <rect x="2" y="5" width="44" height="44" rx="14" fill="#fcf0ed" stroke="#f4ded9" stroke-width="1.2" class="brand-emblem-bg"/>
  
  <!-- Radiance Droplet / Sun Sparkle -->
  <path d="M24 12 C24 12 32 20 32 26 C32 30.4 28.4 34 24 34 C19.6 34 16 30.4 16 26 C16 20 24 12 24 12 Z" fill="url(#gloweSunGrad)" opacity="0.9"/>
  
  <!-- Botanical Leaf Overlay -->
  <path d="M24 34 C24 34 35 31 35 21 C29 21 24 26 24 34 Z" fill="url(#gloweLeafGrad)"/>
  <path d="M24 34 C24 34 27 27 34 22" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Wordmark "Glowé" -->
  <text x="56" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="currentColor" class="brand-name">Glowé</text>
  
  <!-- Subtitle Tagline -->
  <text x="57" y="45" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.24em" fill="#7a9155" class="brand-sub">BOTANICAL SCIENCE</text>
</svg>
