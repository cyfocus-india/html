<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coming Soon — Glowé</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body data-page="coming" data-depth="1">
  <main id="main-content" class="center-page section-soft">
    <div style="max-width:650px;width:100%" data-reveal>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:12px;flex-wrap:wrap">
        <a class="brand" href="../index.html" aria-label="Glowé home">
          <span class="brand-emblem" aria-hidden="true">
            <svg class="brand-logo-svg" viewBox="0 0 44 44" width="36" height="36" fill="none" role="img">
              <rect width="44" height="44" rx="13" fill="#fcf0ed" stroke="#f4ded9" stroke-width="1.2" class="brand-emblem-bg"/>
              <path d="M22 10 C22 10 30 18 30 24 C30 28.4 26.4 32 22 32 C17.6 32 14 28.4 14 24 C14 18 22 10 22 10 Z" fill="url(#brandSunGrad-soon)" opacity="0.9"/>
              <path d="M22 32 C22 32 33 29 33 19 C27 19 22 24 22 32 Z" fill="url(#brandLeafGrad-soon)"/>
              <path d="M22 32 C22 32 25 25 32 20" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
              <defs>
                <linearGradient id="brandLeafGrad-soon" x1="14" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#7a9155"/>
                  <stop offset="100%" stop-color="#556c34"/>
                </linearGradient>
                <linearGradient id="brandSunGrad-soon" x1="18" y1="10" x2="34" y2="26" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#eb7378"/>
                  <stop offset="100%" stop-color="#d99a34"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="brand-text-wrap">
            <span class="brand-title">Glowé</span>
            <span class="brand-tag">BOTANICAL SCIENCE</span>
          </span>
        </a>
        <div class="standalone-utility-bar" aria-label="Appearance and layout settings">
          <button class="icon-btn theme-button" type="button" aria-label="Toggle color theme" title="Toggle color theme"><i data-lucide="moon"></i></button>
          <button class="dir-toggle-btn rtl-button" type="button" aria-label="Toggle right-to-left layout" title="Toggle RTL layout"><span class="dir-badge">RTL</span></button>
        </div>
      </div>
      <span class="round-icon float" style="margin:0 auto 25px;width:70px;height:70px"><i data-lucide="flower-2"></i></span>
      <span class="eyebrow">Stay Tuned</span>
      <h1 style="font-size:clamp(3.2rem,8vw,6.5rem)">Coming Soon</h1>
      <p class="lead" style="margin-inline:auto">We’re polishing a new corner of Glowé. Enter your email and we’ll notify you when it’s ready.</p>
      <form class="inline-form newsletter-form" style="max-width:500px;margin:28px auto" novalidate>
        <label class="sr-only" for="soon-email">Email address</label>
        <input id="soon-email" type="email" placeholder="Your email address" required>
        <button class="btn" type="submit">Notify me</button>
      </form>
      <a class="text-link" href="../index.html" style="justify-content:center"><i data-lucide="arrow-left"></i> Return to Homepage</a>
    </div>
  </main>
  <script src="../assets/js/lucide.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
